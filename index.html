<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9f8f0">
<title>ONE聚｜應用程式下載</title>
<style>
  :root { --ink:#103c33; --muted:#5b6c70; --mint:#e7f7ef; --line:#dcefe6; }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:28px 16px; min-height:100vh;
    background:linear-gradient(145deg,#eefaf4,#f8fbfa 55%,#eaf7f0);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
    display:flex; justify-content:center; align-items:center;
  }
  .page {
    width:min(100%,760px); background:rgba(255,255,255,.94);
    border:1px solid #edf4f0; border-radius:32px; padding:34px clamp(18px,5vw,44px);
    box-shadow:0 18px 60px rgba(21,79,61,.09);
  }
  header { text-align:center; margin-bottom:28px; }
  .app-icon {
    width:104px;height:104px;object-fit:cover;border-radius:26px;
    display:block;margin:0 auto 18px;box-shadow:0 10px 25px rgba(20,60,50,.16);
  }
  h1 { font-size:clamp(30px,6vw,44px); margin:0 0 6px; letter-spacing:.02em; }
  .subtitle { font-size:clamp(18px,3.8vw,23px); color:var(--muted); margin:0 0 8px; font-weight:650; }
  .intro { margin:0; color:#667579; font-size:16px; }
  .options { display:grid; gap:14px; }
  .option {
    display:grid; grid-template-columns:62px minmax(0,1fr) 28px; gap:16px; align-items:center;
    padding:20px 18px; border:1px solid var(--line); border-radius:22px;
    text-decoration:none; color:inherit; background:#fbfffd;
    box-shadow:0 5px 15px rgba(27,90,67,.04); transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .option:hover,.option:focus-visible { transform:translateY(-2px); border-color:#9bd9bd; box-shadow:0 10px 24px rgba(27,90,67,.11); outline:none; }
  .symbol { width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#e7f7ef;font-size:30px;font-weight:700; }
  .android .symbol { color:#258b58; }
  .web { background:#f0f8ff; border-color:#dcecfb; }
  .web .symbol { background:#dcefff; color:#397aa9; }
  .name { font-size:clamp(18px,3.5vw,23px);font-weight:800;margin:0 0 5px; }
  .desc { color:var(--muted);font-size:15px;line-height:1.55;margin:0; }
  .chevron { font-size:30px;color:#6a7a7d; text-align:right; }
  footer {text-align:center;color:#84918e;font-size:12px;margin-top:22px}
  @media (max-width:420px) {
    .page {padding:28px 14px;border-radius:24px}
    .option {grid-template-columns:48px minmax(0,1fr) 20px;gap:12px;padding:16px 12px}
    .symbol {width:48px;height:48px;font-size:25px}
  }
</style>
</head>
